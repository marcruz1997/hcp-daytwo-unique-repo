# Placements só enxergam clusters de clustersets ligados ao namespace da policy.
# "global" contém todos os clusters, inclusive o local-cluster (hub).
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: global
  namespace: pg-provisioning
spec:
  clusterSet: global
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: global
  namespace: pg-policies-hub
spec:
  clusterSet: global
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: global
  namespace: pg-policies-features
spec:
  clusterSet: global
