# Placement compartilhada por TODAS as policies de provisionamento (hcp-<nome>):
# elas rodam no próprio hub (local-cluster), que é onde vivem HostedCluster/NodePool.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: pl-local-cluster
  namespace: pg-provisioning
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - {key: local-cluster, operator: In, values: ["true"]}
  tolerations:
    - {key: cluster.open-cluster-management.io/unreachable, operator: Exists}
    - {key: cluster.open-cluster-management.io/unavailable, operator: Exists}
