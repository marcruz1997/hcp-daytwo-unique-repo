# Namespaces do hub usados por este repo.
apiVersion: v1
kind: Namespace
metadata:
  name: clusters                 # HostedClusters
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: pg-provisioning          # policies que criam os clusters (uma por cluster)
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: pg-policies-hub          # policies que rodam no hub (pull-secret)
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: pg-policies-features     # policies de day-2 + buckets do Loki
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: hcp-etcd-backup          # CronJobs de backup do etcd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-backup
  namespace: hcp-etcd-backup
