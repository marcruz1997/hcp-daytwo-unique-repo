# Backup diário do etcd do control plane: CronJob no hub, PVC em hcp-etcd-backup.
# Horário/retenção: features/etcd-backup/resources.yaml (schedule / RETENTION_DAYS).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - resources.yaml
patches:
  - target: {kind: ManagedCluster}
    patch: |-
      - op: add
        path: /metadata/labels/feature.pg.lab~1etcd-backup
        value: "true"
