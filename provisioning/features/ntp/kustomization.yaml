# NTP (chrony) em TODOS os NodePools (workers e infra).
# Servidores: features/ntp/chrony-configmap.yaml (gere com scripts/chrony-b64.sh).
# ATENÇÃO: ligar/mudar num cluster existente RECRIA os nós (upgradeType: Replace).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - chrony-configmap.yaml
patches:
  - target: {kind: NodePool, labelSelector: pg.lab/pool=worker}
    patch: |-
      - op: add
        path: /metadata/labels/pg.lab~1ntp
        value: "true"
      - op: add
        path: /spec/config/-
        value:
          name: CLUSTER-chrony
  - target: {kind: ManagedCluster}
    patch: |-
      - op: add
        path: /metadata/labels/feature.pg.lab~1ntp
        value: "true"
