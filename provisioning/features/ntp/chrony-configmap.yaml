# MachineConfig do chrony entregue ao NodePool (em HCP não existe MachineConfig direto no cluster).
# Conteúdo atual (base64): server a.ntp.br / server b.ntp.br
# Para trocar os servidores, gere o base64 com:  scripts/chrony-b64.sh ntp1.empresa ntp2.empresa  (cole na linha source abaixo)
# ATENÇÃO: mudar este conteúdo RECRIA os nós (upgradeType: Replace).
apiVersion: v1
kind: ConfigMap
metadata:
  name: CLUSTER-chrony
  namespace: clusters
  labels:
    pg.lab/role: chrony
data:
  config: |
    apiVersion: machineconfiguration.openshift.io/v1
    kind: MachineConfig
    metadata:
      name: 99-worker-chrony
      labels:
        machineconfiguration.openshift.io/role: worker
    spec:
      config:
        ignition:
          version: 3.2.0
        storage:
          files:
            - path: /etc/chrony.conf
              mode: 420
              overwrite: true
              contents:
                source: data:text/plain;charset=utf-8;base64,c2VydmVyIGEubnRwLmJyIGlidXJzdApzZXJ2ZXIgYi5udHAuYnIgaWJ1cnN0CmRyaWZ0ZmlsZSAvdmFyL2xpYi9jaHJvbnkvZHJpZnQKbWFrZXN0ZXAgMS4wIDMKcnRjc3luYwpsb2dkaXIgL3Zhci9sb2cvY2hyb255Cg==
