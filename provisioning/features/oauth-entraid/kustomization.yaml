# Login com Microsoft Entra ID (OpenID Connect) + cluster-admin para um grupo do Entra.
#  - IdP "entraid" no HostedCluster (em HCP o OAuth roda no hub)
#  - cluster-admin para o grupo: policy feature-oauth-entraid (day-2), via labels
# Pode ficar ligado junto com features/oauth-htpasswd (os dois aparecem na tela de login).
# Parâmetros: entraid.tenantId, entraid.clientId, entraid.adminGroup
# Fora do Git: Secret "entraid-<nome>" no namespace clusters, chave clientSecret (manual 3.1.2).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: {kind: HostedCluster}
    patch: |-
      - op: add
        path: /metadata/labels/pg.lab~1oauth-entraid
        value: "true"
      - op: add
        path: /spec/configuration/oauth/identityProviders/-
        value:
          name: entraid
          type: OpenID
          mappingMethod: claim
          openID:
            clientID: ENTRAID_CLIENT_ID
            clientSecret:
              name: entraid-CLUSTER
            issuer: https://login.microsoftonline.com/ENTRAID_TENANT/v2.0
            claims:
              preferredUsername: [preferred_username, email]
              name: [name]
              email: [email]
              groups: [groups]
  - target: {kind: ManagedCluster}
    patch: |-
      - op: add
        path: /metadata/labels/feature.pg.lab~1oauth-entraid
        value: "true"
      - op: add
        path: /metadata/labels/config.pg.lab~1entraid-admin-group
        value: "PLACEHOLDER"
