# Day-2: router nos nós de infra + réplicas (policy feature-ingress).
# Parâmetro: ingress.replicas (<= número de nós de infra)
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: {kind: ManagedCluster}
    patch: |-
      - op: add
        path: /metadata/labels/feature.pg.lab~1ingress
        value: "true"
      - op: add
        path: /metadata/labels/config.pg.lab~1ingress-replicas
        value: "PLACEHOLDER"
