# Day-2: monitoring persistente + user workload + COO (policy feature-observability).
# Parâmetros: observability.*
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: {kind: ManagedCluster}
    patch: |-
      - op: add
        path: /metadata/labels/feature.pg.lab~1observability
        value: "true"
      - op: add
        path: /metadata/labels/config.pg.lab~1prom-retention
        value: "PLACEHOLDER"
      - op: add
        path: /metadata/labels/config.pg.lab~1prom-storage
        value: "PLACEHOLDER"
      - op: add
        path: /metadata/labels/config.pg.lab~1am-storage
        value: "PLACEHOLDER"
      - op: add
        path: /metadata/labels/config.pg.lab~1uwm-retention
        value: "PLACEHOLDER"
      - op: add
        path: /metadata/labels/config.pg.lab~1uwm-storage
        value: "PLACEHOLDER"
