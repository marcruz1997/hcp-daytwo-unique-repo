# Day-2: Loki Operator + LokiStack (policy feature-loki) + bucket S3 no hub.
# Parâmetros: loki.*   |   Com features/logging não precisa listar este.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - bucket.yaml
patches:
  - target: {kind: ManagedCluster}
    patch: |-
      - op: add
        path: /metadata/labels/feature.pg.lab~1loki
        value: "true"
      - op: add
        path: /metadata/labels/config.pg.lab~1loki-size
        value: "PLACEHOLDER"
      - op: add
        path: /metadata/labels/config.pg.lab~1loki-retention
        value: "PLACEHOLDER"
