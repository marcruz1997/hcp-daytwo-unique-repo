# Proxy + CA própria do proxy (quando ele inspeciona TLS). JÁ INCLUI features/proxy:
# liste um OU outro. Parâmetros: proxy.* e proxy.trustedCA (PEM).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ../proxy
resources:
  - ca-configmap.yaml
patches:
  - target: {kind: HostedCluster}
    patch: |-
      - op: add
        path: /metadata/labels/pg.lab~1proxy-ca
        value: "true"
      - op: add
        path: /spec/configuration/proxy/trustedCA
        value:
          name: CLUSTER-proxy-ca
