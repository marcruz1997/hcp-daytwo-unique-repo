apiVersion: hypershift.openshift.io/v1beta1
kind: NodePool
metadata:
  name: CLUSTER-infra
  namespace: clusters
  labels:
    pg.lab/pool: infra
spec:
  clusterName: CLUSTER
  arch: amd64
  replicas: 3
  nodeLabels:
    node-role.kubernetes.io/infra: ""
    hcp.lab/infra-workloads: "true"
  config: []                      # copiado do pool de workers pelo apply-params (NTP etc.)
  taints:
    - key: node-role.kubernetes.io/infra
      value: reserved
      effect: NoSchedule
    - key: node-role.kubernetes.io/infra
      value: reserved
      effect: NoExecute
  management:
    autoRepair: false
    upgradeType: Replace
  release:
    image: RELEASE_IMAGE
  platform:
    type: KubeVirt
    kubevirt:
      attachDefaultNetwork: true
      compute:
        cores: 4
        memory: 16Gi
      rootVolume:
        type: Persistent
        persistent:
          size: 120Gi
