# Parte comum dos nós de infra (incluída por infra/<size>; não use direto).
#  - NodePool <nome>-infra com label/taint de infra
#  - tira o label hcp.lab/infra-workloads dos workers (router/registry/monitoring vão para a infra)
#  - label feature.pg.lab/infra-nodes no ManagedCluster
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - nodepool-infra.yaml
patches:
  - target: {kind: NodePool, labelSelector: pg.lab/pool=worker}
    patch: |-
      - op: remove
        path: /spec/nodeLabels/hcp.lab~1infra-workloads
  - target: {kind: ManagedCluster}
    patch: |-
      - op: add
        path: /metadata/labels/feature.pg.lab~1infra-nodes
        value: "true"
