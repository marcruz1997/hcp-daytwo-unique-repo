# Nós de infra "demo": 2 cores, 8Gi, disco 120Gi (por nó).
# Para mudar este tamanho em TODOS os clusters, edite aqui.
# Inclui o NodePool de infra: basta listar infra/demo no cluster.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ../_common
patches:
  - target: {kind: NodePool, labelSelector: pg.lab/pool=infra}
    patch: |-
      - op: replace
        path: /spec/platform/kubevirt/compute
        value:
          cores: 2
          memory: 8Gi
      - op: replace
        path: /spec/platform/kubevirt/rootVolume/persistent/size
        value: 120Gi
