# Nós de infra "medium": 8 cores, 32Gi, disco 120Gi (por nó).
# Para mudar este tamanho em TODOS os clusters, edite aqui.
# Inclui o NodePool de infra: basta listar infra/medium no cluster.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ../_common
patches:
  - target: {kind: NodePool, labelSelector: pg.lab/pool=infra}
    patch: |-
      - op: replace
        path: /spec/platform/kubevirt/compute
        value:
          cores: 8
          memory: 32Gi
      - op: replace
        path: /spec/platform/kubevirt/rootVolume/persistent/size
        value: 120Gi
