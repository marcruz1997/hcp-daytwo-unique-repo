apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: CLUSTER
  labels:
    name: CLUSTER
    cloud: BareMetal
    vendor: OpenShift
    env: ENV
    cluster-group: default
    # Todas as features começam DESLIGADAS; cada component troca o seu label para "true".
    # Tirar a feature da lista faz o label voltar a "false" e a policy de day-2 sai do cluster.
    feature.pg.lab/oauth-htpasswd: "false"
    feature.pg.lab/oauth-entraid: "false"
    feature.pg.lab/ingress: "false"
    feature.pg.lab/registry: "false"
    feature.pg.lab/loki: "false"
    feature.pg.lab/logging: "false"
    feature.pg.lab/observability: "false"
    feature.pg.lab/infra-nodes: "false"
    feature.pg.lab/ntp: "false"
    feature.pg.lab/etcd-backup: "false"
  annotations:
    import.open-cluster-management.io/hosting-cluster-name: local-cluster
    import.open-cluster-management.io/klusterlet-deploy-mode: Hosted
    open-cluster-management/created-via: hypershift
spec:
  hubAcceptsClient: true
