# NodePool de workers. Tamanho: component worker-size/<size>.
# O label pg.lab/pool é só para os components acharem este pool.
apiVersion: hypershift.openshift.io/v1beta1
kind: NodePool
metadata:
  name: CLUSTER
  namespace: clusters
  labels:
    pg.lab/pool: worker
spec:
  clusterName: CLUSTER
  arch: amd64
  replicas: 2
  # Onde rodam router/registry/monitoring/loki. O component infra-nodes remove daqui
  # e coloca no pool de infra.
  nodeLabels:
    hcp.lab/infra-workloads: "true"
  management:
    autoRepair: false
    upgradeType: Replace
  release:
    image: RELEASE_IMAGE
  platform:
    type: KubeVirt
    kubevirt:
      attachDefaultNetwork: true
      compute:
        cores: 4
        memory: 16Gi
      rootVolume:
        type: Persistent
        persistent:
          size: 64Gi
