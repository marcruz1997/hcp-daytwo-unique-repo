apiVersion: hypershift.openshift.io/v1beta1
kind: HostedCluster
metadata:
  name: CLUSTER
  namespace: clusters
  labels:
    pg.lab/role: hostedcluster
spec:
  infraID: CLUSTER
  release:
    image: RELEASE_IMAGE
  pullSecret:
    name: hcp-pull-secret          # copiado do hub pela policy em policies/hub
  sshKey:
    name: sshkey-cluster-CLUSTER
  etcd:
    managementType: Managed
    managed:
      storage:
        type: PersistentVolume
        persistentVolume:
          size: 8Gi
          storageClassName: ocs-external-storagecluster-ceph-rbd-immediate
  networking:
    clusterNetwork:
      - cidr: CLUSTER_NETWORK
    serviceNetwork:
      - cidr: SERVICE_NETWORK
    networkType: OVNKubernetes
  controllerAvailabilityPolicy: HighlyAvailable
  infrastructureAvailabilityPolicy: HighlyAvailable
  platform:
    type: KubeVirt
    kubevirt:
      baseDomainPassthrough: true
  services:
    - service: OAuthServer
      servicePublishingStrategy: {type: Route}
    - service: OIDC
      servicePublishingStrategy: {type: Route}
    - service: Konnectivity
      servicePublishingStrategy: {type: Route}
    - service: Ignition
      servicePublishingStrategy: {type: Route}
    - service: APIServer
      servicePublishingStrategy: {type: LoadBalancer}
