# =====================================================================
# DEFAULTS de todos os clusters. NÃO é aplicado (local-config): só alimenta
# o transformer apply-params. Cada cluster sobrescreve o que quiser no patch
# do seu clusters/<nome>/cluster/kustomization.yaml.
# =====================================================================
apiVersion: pg.lab/v1
kind: ClusterParams
metadata:
  name: params
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  name: DEFINA_O_NOME                  # obrigatório no cluster (inválido de propósito)
  env: dev
  releaseImage: quay.io/openshift-release-dev/ocp-release:4.18.60-multi
  clusterNetwork: 10.132.0.0/14
  serviceNetwork: 172.31.0.0/16
  workerReplicas: 2
  infraReplicas: 3
  # Chave PÚBLICA usada em todos os clusters (cat ~/.ssh/hcp-clusters.pub)
  sshPublicKey: "ssh-rsa AAAA...COLE-SUA-CHAVE-PUBLICA..."

  # ---- parâmetros das features (só usados se a feature estiver na lista) ----
  proxy:                               # features/proxy e features/proxy-ca
    httpProxy: ""                      # ex.: http://proxy.empresa.local:3128
    httpsProxy: ""                     # ex.: http://proxy.empresa.local:3128
    # Domínios/redes que NÃO passam pelo proxy (separados por vírgula). O OpenShift já
    # acrescenta sozinho as redes do próprio cluster. Inclua a rede do hub e o domínio
    # apps do hub (endpoint S3 do Loki), se o proxy não alcançar.
    noProxy: ""
    # Só com features/proxy-ca: CA do proxy (quando ele inspeciona TLS), em PEM.
    trustedCA: ""
  oauth:                               # features/oauth-htpasswd
    adminUser: admin
    # htpasswd -nbB admin 'senha'   (vários usuários: uma linha cada)
    htpasswd: |
      admin:$2y$05$1sw1u/TRkzkRGBUoUbCy4.IiSJHAtjZj5Qmx0yPukhBtDmys23GdO
  ingress:                             # features/ingress (<= nº de nós de infra)
    replicas: "2"
  observability:                       # features/observability
    prometheusRetention: 7d
    prometheusStorage: 20Gi
    alertmanagerStorage: 5Gi
    uwmRetention: 7d
    uwmStorage: 20Gi
  loki:                                # features/loki e features/logging
    size: 1x.demo
    retentionDays: "7"
    # StorageClass de bucket (ObjectBucketClaim) do hub. Endpoint e CA são descobertos sozinhos.
    bucketStorageClass: openshift-storage.noobaa.io
