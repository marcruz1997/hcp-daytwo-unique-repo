# Em HCP o etcd roda no HUB (namespace clusters-<nome>). CronJob no hub tira snapshot via etcdctl.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etcd-backup-CLUSTER
  namespace: hcp-etcd-backup
  labels:
    pg.lab/role: etcd-backup
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ocs-external-storagecluster-ceph-rbd-immediate
  resources:
    requests:
      storage: 10Gi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: etcd-backup
  namespace: clusters-CLUSTER
  labels:
    pg.lab/role: etcd-backup
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: etcd-backup
  namespace: clusters-CLUSTER
  labels:
    pg.lab/role: etcd-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: etcd-backup
subjects:
  - kind: ServiceAccount
    name: etcd-backup
    namespace: hcp-etcd-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup-CLUSTER
  namespace: hcp-etcd-backup
  labels:
    pg.lab/role: etcd-backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: etcd-backup
          restartPolicy: Never
          containers:
            - name: backup
              image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
              env:
                - name: CP_NS
                  value: clusters-CLUSTER
                - name: RETENTION_DAYS
                  value: "7"
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  TS=$(date +%Y%m%d-%H%M%S)
                  POD=$(oc -n "$CP_NS" get pods -l app=etcd --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
                  echo "snapshot do etcd em $CP_NS/$POD"
                  oc -n "$CP_NS" exec "$POD" -c etcd -- env ETCDCTL_API=3 /usr/bin/etcdctl \
                    --cacert /etc/etcd/tls/etcd-ca/ca.crt \
                    --cert /etc/etcd/tls/client/etcd-client.crt \
                    --key /etc/etcd/tls/client/etcd-client.key \
                    --endpoints=https://localhost:2379 \
                    snapshot save /var/lib/data/snapshot.db
                  oc -n "$CP_NS" exec "$POD" -c etcd -- cat /var/lib/data/snapshot.db > "/backup/etcd-${TS}.db"
                  oc -n "$CP_NS" exec "$POD" -c etcd -- rm -f /var/lib/data/snapshot.db
                  ls -lh "/backup/etcd-${TS}.db"
                  find /backup -name 'etcd-*.db' -mtime +"$RETENTION_DAYS" -print -delete
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: etcd-backup-CLUSTER
