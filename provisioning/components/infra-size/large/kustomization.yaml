# Nós de infra tamanho "large": 16 cores, 64Gi, disco 150Gi (por nó).
# Para mudar o tamanho para todos os clusters, edite este arquivo.
# Use DEPOIS do component infra-nodes.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: NodePool
      labelSelector: pg.lab/pool=infra
    patch: |-
      - op: replace
        path: /spec/platform/kubevirt/compute
        value:
          cores: 16
          memory: 64Gi
      - op: replace
        path: /spec/platform/kubevirt/rootVolume/persistent/size
        value: 150Gi
