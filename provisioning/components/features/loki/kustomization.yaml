# Day-2: Loki Operator + LokiStack (policy feature-loki) + bucket S3 no hub.
# Requer no params.yaml: spec.loki.size, spec.loki.retentionDays, spec.loki.s3Scheme (entre aspas)
# NÃO use junto com features/logging (o logging já inclui o loki).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - bucket.yaml
patches:
  - target: {kind: ManagedCluster}
    patch: |-
      - op: add
        path: /metadata/labels/feature.pg.lab~1loki
        value: "true"
      - op: add
        path: /metadata/labels/config.pg.lab~1loki-size
        value: "PLACEHOLDER"
      - op: add
        path: /metadata/labels/config.pg.lab~1loki-retention
        value: "PLACEHOLDER"
      - op: add
        path: /metadata/labels/config.pg.lab~1loki-s3-scheme
        value: "PLACEHOLDER"
replacements:
  - source: {kind: ClusterParams, name: params, fieldPath: spec.name}
    targets:
      - select: {kind: ObjectBucketClaim, labelSelector: pg.lab/role=loki-bucket}
        fieldPaths: [metadata.name, spec.generateBucketName]
        options: {delimiter: "-", index: 1}
  - source: {kind: ClusterParams, name: params, fieldPath: spec.loki.size}
    targets:
      - select: {kind: ManagedCluster}
        fieldPaths: ["metadata.labels.[config.pg.lab/loki-size]"]
  - source: {kind: ClusterParams, name: params, fieldPath: spec.loki.retentionDays}
    targets:
      - select: {kind: ManagedCluster}
        fieldPaths: ["metadata.labels.[config.pg.lab/loki-retention]"]
  - source: {kind: ClusterParams, name: params, fieldPath: spec.loki.s3Scheme}
    targets:
      - select: {kind: ManagedCluster}
        fieldPaths: ["metadata.labels.[config.pg.lab/loki-s3-scheme]"]
