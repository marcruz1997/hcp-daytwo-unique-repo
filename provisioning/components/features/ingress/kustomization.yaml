# Day-2: router nos nós de infra + réplicas (policy feature-ingress).
# Requer no params.yaml: spec.ingress.replicas (entre aspas, ex.: "3")
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: {kind: ManagedCluster}
    patch: |-
      - op: add
        path: /metadata/labels/feature.pg.lab~1ingress
        value: "true"
replacements:
  - source: {kind: ClusterParams, name: params, fieldPath: spec.ingress.replicas}
    targets:
      - select: {kind: ManagedCluster}
        fieldPaths: ["metadata.labels.[config.pg.lab/ingress-replicas]"]
        options: {create: true}
