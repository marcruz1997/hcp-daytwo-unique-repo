# NTP (chrony) em TODOS os NodePools.
# Use DEPOIS de infra-nodes (senão o pool de infra fica sem NTP).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - chrony-configmap.yaml
patches:
  - target: {kind: NodePool}
    patch: |-
      - op: add
        path: /spec/config
        value:
          - name: CLUSTER-chrony
  - target: {kind: ManagedCluster}
    patch: |-
      - op: add
        path: /metadata/labels/feature.pg.lab~1ntp
        value: "true"
replacements:
  - source: {kind: ClusterParams, name: params, fieldPath: spec.name}
    targets:
      - select: {kind: ConfigMap, labelSelector: pg.lab/role=chrony}
        fieldPaths: [metadata.name]
        options: {delimiter: "-", index: 0}
      - select: {kind: NodePool}
        fieldPaths: ["spec.config.[name=CLUSTER-chrony].name"]
        options: {delimiter: "-", index: 0}
