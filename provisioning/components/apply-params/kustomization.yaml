# SEMPRE O ÚLTIMO component da lista do cluster.
# Copia os valores do params.yaml (kind ClusterParams) para os recursos da base.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
replacements:
  # ---- nome do cluster ----
  - source: {kind: ClusterParams, name: params, fieldPath: spec.name}
    targets:
      - select: {kind: HostedCluster}
        fieldPaths: [metadata.name, spec.infraID]
      - select: {kind: HostedCluster}
        fieldPaths: [spec.sshKey.name]
        options: {delimiter: "-", index: 2}       # sshkey-cluster-<nome>
      - select: {kind: NodePool, labelSelector: pg.lab/pool=worker}
        fieldPaths: [metadata.name]
      - select: {kind: NodePool}
        fieldPaths: [spec.clusterName]
      - select: {kind: ManagedCluster}
        fieldPaths: [metadata.name, metadata.labels.name]
      - select: {kind: KlusterletAddonConfig}
        fieldPaths: [metadata.name, metadata.namespace, spec.clusterName, spec.clusterNamespace]
      - select: {kind: Secret, labelSelector: pg.lab/role=sshkey}
        fieldPaths: [metadata.name]
        options: {delimiter: "-", index: 2}
  # ---- versão ----
  - source: {kind: ClusterParams, name: params, fieldPath: spec.releaseImage}
    targets:
      - select: {kind: HostedCluster}
        fieldPaths: [spec.release.image]
      - select: {kind: NodePool}
        fieldPaths: [spec.release.image]
  # ---- workers ----
  - source: {kind: ClusterParams, name: params, fieldPath: spec.workerReplicas}
    targets:
      - select: {kind: NodePool, labelSelector: pg.lab/pool=worker}
        fieldPaths: [spec.replicas]
  # ---- ssh ----
  - source: {kind: ClusterParams, name: params, fieldPath: spec.sshPublicKey}
    targets:
      - select: {kind: Secret, labelSelector: pg.lab/role=sshkey}
        fieldPaths: ["stringData.[id_rsa.pub]"]
  # ---- rede ----
  - source: {kind: ClusterParams, name: params, fieldPath: spec.clusterNetwork}
    targets:
      - select: {kind: HostedCluster}
        fieldPaths: ["spec.networking.clusterNetwork.[cidr=CLUSTER_NETWORK].cidr"]
  - source: {kind: ClusterParams, name: params, fieldPath: spec.serviceNetwork}
    targets:
      - select: {kind: HostedCluster}
        fieldPaths: ["spec.networking.serviceNetwork.[cidr=SERVICE_NETWORK].cidr"]
  # ---- label env ----
  - source: {kind: ClusterParams, name: params, fieldPath: spec.env}
    targets:
      - select: {kind: ManagedCluster}
        fieldPaths: [metadata.labels.env]
