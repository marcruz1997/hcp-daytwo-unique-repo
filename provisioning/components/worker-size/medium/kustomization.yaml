# Workers tamanho "medium": 8 cores, 32Gi, disco 100Gi (por nó).
# Para mudar o tamanho para todos os clusters, edite este arquivo.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: NodePool
      labelSelector: pg.lab/pool=worker
    patch: |-
      - op: replace
        path: /spec/platform/kubevirt/compute
        value:
          cores: 8
          memory: 32Gi
      - op: replace
        path: /spec/platform/kubevirt/rootVolume/persistent/size
        value: 100Gi
