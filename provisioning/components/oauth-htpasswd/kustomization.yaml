# Login htpasswd + cluster-admin para spec.oauth.adminUser.
#  - IdP no HostedCluster (em HCP o OAuth roda no hub)
#  - cluster-admin: policy feature-oauth-htpasswd (policies/features), via label
# Requer no params.yaml: spec.oauth.adminUser e spec.oauth.htpasswd
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - htpasswd-secret.yaml
patches:
  - target: {kind: HostedCluster}
    patch: |-
      - op: add
        path: /spec/configuration
        value:
          oauth:
            identityProviders:
              - name: htpasswd
                type: HTPasswd
                mappingMethod: claim
                htpasswd:
                  fileData:
                    name: htpasswd-CLUSTER
  - target: {kind: ManagedCluster}
    patch: |-
      - op: add
        path: /metadata/labels/feature.pg.lab~1oauth-htpasswd
        value: "true"
      - op: add
        path: /metadata/labels/config.pg.lab~1oauth-admin
        value: "PLACEHOLDER"
replacements:
  - source: {kind: ClusterParams, name: params, fieldPath: spec.name}
    targets:
      - select: {kind: Secret, labelSelector: pg.lab/role=htpasswd}
        fieldPaths: [metadata.name]
        options: {delimiter: "-", index: 1}
      - select: {kind: HostedCluster}
        fieldPaths: ["spec.configuration.oauth.identityProviders.[name=htpasswd].htpasswd.fileData.name"]
        options: {delimiter: "-", index: 1}
  - source: {kind: ClusterParams, name: params, fieldPath: spec.oauth.htpasswd}
    targets:
      - select: {kind: Secret, labelSelector: pg.lab/role=htpasswd}
        fieldPaths: [stringData.htpasswd]
  - source: {kind: ClusterParams, name: params, fieldPath: spec.oauth.adminUser}
    targets:
      - select: {kind: ManagedCluster}
        fieldPaths: ["metadata.labels.[config.pg.lab/oauth-admin]"]
