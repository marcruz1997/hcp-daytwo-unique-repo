# Todas as substituições, num lugar só. Você só mexe aqui se criar um component novo.
apiVersion: builtin
kind: ReplacementTransformer
metadata:
  name: apply-params
replacements:
  # ---------------- NTP (roda ANTES de renomear os NodePools) ----------------
  # 1) nome do ConfigMap do chrony no pool de workers
  - source: {kind: ClusterParams, name: params, fieldPath: spec.name}
    targets:
      - select: {kind: NodePool, labelSelector: "pg.lab/pool=worker,pg.lab/ntp=true"}
        fieldPaths:
          - "spec.config.[name=CLUSTER-chrony].name"
        options: {delimiter: "-", index: 0}
  # 2) infra recebe os mesmos MachineConfigs dos workers (a origem só pode ser por nome,
  #    por isso usa o nome original "CLUSTER" do NodePool de workers)
  - source: {kind: NodePool, name: CLUSTER, fieldPath: spec.config}
    targets:
      - select: {kind: NodePool, labelSelector: pg.lab/pool=infra}
        fieldPaths:
          - "spec.config"
  # ---------------- nome do cluster ----------------
  - source: {kind: ClusterParams, name: params, fieldPath: spec.name}
    targets:
      - select: {kind: HostedCluster}
        fieldPaths:
          - "metadata.name"
          - "spec.infraID"
      - select: {kind: HostedCluster}
        fieldPaths:
          - "spec.sshKey.name"
        options: {delimiter: "-", index: 2}
      - select: {kind: HostedCluster, labelSelector: pg.lab/oauth=true}
        fieldPaths:
          - "spec.configuration.oauth.identityProviders.[name=htpasswd].htpasswd.fileData.name"
        options: {delimiter: "-", index: 1}
      - select: {kind: NodePool, labelSelector: pg.lab/pool=worker}
        fieldPaths:
          - "metadata.name"
      - select: {kind: NodePool, labelSelector: pg.lab/pool=infra}
        fieldPaths:
          - "metadata.name"
        options: {delimiter: "-", index: 0}
      - select: {kind: NodePool}
        fieldPaths:
          - "spec.clusterName"
      - select: {kind: ManagedCluster}
        fieldPaths:
          - "metadata.name"
          - "metadata.labels.name"
      - select: {kind: KlusterletAddonConfig}
        fieldPaths:
          - "metadata.name"
          - "metadata.namespace"
          - "spec.clusterName"
          - "spec.clusterNamespace"
      - select: {kind: Secret, labelSelector: pg.lab/role=sshkey}
        fieldPaths:
          - "metadata.name"
        options: {delimiter: "-", index: 2}
      - select: {kind: Secret, labelSelector: pg.lab/role=htpasswd}
        fieldPaths:
          - "metadata.name"
        options: {delimiter: "-", index: 1}
      - select: {kind: ConfigMap, labelSelector: pg.lab/role=chrony}
        fieldPaths:
          - "metadata.name"
        options: {delimiter: "-", index: 0}
      - select: {kind: PersistentVolumeClaim, labelSelector: pg.lab/role=etcd-backup}
        fieldPaths:
          - "metadata.name"
        options: {delimiter: "-", index: 2}
      - select: {kind: CronJob, labelSelector: pg.lab/role=etcd-backup}
        fieldPaths:
          - "metadata.name"
          - "spec.jobTemplate.spec.template.spec.volumes.[name=backup].persistentVolumeClaim.claimName"
        options: {delimiter: "-", index: 2}
      - select: {kind: CronJob, labelSelector: pg.lab/role=etcd-backup}
        fieldPaths:
          - "spec.jobTemplate.spec.template.spec.containers.[name=backup].env.[name=CP_NS].value"
        options: {delimiter: "-", index: 1}
      - select: {kind: Role, labelSelector: pg.lab/role=etcd-backup}
        fieldPaths:
          - "metadata.namespace"
        options: {delimiter: "-", index: 1}
      - select: {kind: RoleBinding, labelSelector: pg.lab/role=etcd-backup}
        fieldPaths:
          - "metadata.namespace"
        options: {delimiter: "-", index: 1}
      - select: {kind: ObjectBucketClaim, labelSelector: pg.lab/role=loki-bucket}
        fieldPaths:
          - "metadata.name"
          - "spec.generateBucketName"
        options: {delimiter: "-", index: 1}
  # ---------------- versão / tamanho / acesso / rede ----------------
  - source: {kind: ClusterParams, name: params, fieldPath: spec.releaseImage}
    targets:
      - select: {kind: HostedCluster}
        fieldPaths:
          - "spec.release.image"
      - select: {kind: NodePool}
        fieldPaths:
          - "spec.release.image"
  - source: {kind: ClusterParams, name: params, fieldPath: spec.workerReplicas}
    targets:
      - select: {kind: NodePool, labelSelector: pg.lab/pool=worker}
        fieldPaths:
          - "spec.replicas"
  - source: {kind: ClusterParams, name: params, fieldPath: spec.infraReplicas}
    targets:
      - select: {kind: NodePool, labelSelector: pg.lab/pool=infra}
        fieldPaths:
          - "spec.replicas"
  - source: {kind: ClusterParams, name: params, fieldPath: spec.sshPublicKey}
    targets:
      - select: {kind: Secret, labelSelector: pg.lab/role=sshkey}
        fieldPaths:
          - "stringData.[id_rsa.pub]"
  - source: {kind: ClusterParams, name: params, fieldPath: spec.clusterNetwork}
    targets:
      - select: {kind: HostedCluster}
        fieldPaths:
          - "spec.networking.clusterNetwork.[cidr=CLUSTER_NETWORK].cidr"
  - source: {kind: ClusterParams, name: params, fieldPath: spec.serviceNetwork}
    targets:
      - select: {kind: HostedCluster}
        fieldPaths:
          - "spec.networking.serviceNetwork.[cidr=SERVICE_NETWORK].cidr"
  - source: {kind: ClusterParams, name: params, fieldPath: spec.env}
    targets:
      - select: {kind: ManagedCluster}
        fieldPaths:
          - "metadata.labels.env"
  # ---------------- parâmetros das features (só se a feature estiver ligada) ----------------
  - source: {kind: ClusterParams, name: params, fieldPath: spec.oauth.htpasswd}
    targets:
      - select: {kind: Secret, labelSelector: pg.lab/role=htpasswd}
        fieldPaths:
          - "stringData.htpasswd"
  - source: {kind: ClusterParams, name: params, fieldPath: spec.oauth.adminUser}
    targets:
      - select: {kind: ManagedCluster, labelSelector: feature.pg.lab/oauth-htpasswd=true}
        fieldPaths:
          - "metadata.labels.[config.pg.lab/oauth-admin]"
  - source: {kind: ClusterParams, name: params, fieldPath: spec.ingress.replicas}
    targets:
      - select: {kind: ManagedCluster, labelSelector: feature.pg.lab/ingress=true}
        fieldPaths:
          - "metadata.labels.[config.pg.lab/ingress-replicas]"
  - source: {kind: ClusterParams, name: params, fieldPath: spec.observability.prometheusRetention}
    targets:
      - select: {kind: ManagedCluster, labelSelector: feature.pg.lab/observability=true}
        fieldPaths:
          - "metadata.labels.[config.pg.lab/prom-retention]"
  - source: {kind: ClusterParams, name: params, fieldPath: spec.observability.prometheusStorage}
    targets:
      - select: {kind: ManagedCluster, labelSelector: feature.pg.lab/observability=true}
        fieldPaths:
          - "metadata.labels.[config.pg.lab/prom-storage]"
  - source: {kind: ClusterParams, name: params, fieldPath: spec.observability.alertmanagerStorage}
    targets:
      - select: {kind: ManagedCluster, labelSelector: feature.pg.lab/observability=true}
        fieldPaths:
          - "metadata.labels.[config.pg.lab/am-storage]"
  - source: {kind: ClusterParams, name: params, fieldPath: spec.observability.uwmRetention}
    targets:
      - select: {kind: ManagedCluster, labelSelector: feature.pg.lab/observability=true}
        fieldPaths:
          - "metadata.labels.[config.pg.lab/uwm-retention]"
  - source: {kind: ClusterParams, name: params, fieldPath: spec.observability.uwmStorage}
    targets:
      - select: {kind: ManagedCluster, labelSelector: feature.pg.lab/observability=true}
        fieldPaths:
          - "metadata.labels.[config.pg.lab/uwm-storage]"
  - source: {kind: ClusterParams, name: params, fieldPath: spec.loki.size}
    targets:
      - select: {kind: ManagedCluster, labelSelector: feature.pg.lab/loki=true}
        fieldPaths:
          - "metadata.labels.[config.pg.lab/loki-size]"
  - source: {kind: ClusterParams, name: params, fieldPath: spec.loki.retentionDays}
    targets:
      - select: {kind: ManagedCluster, labelSelector: feature.pg.lab/loki=true}
        fieldPaths:
          - "metadata.labels.[config.pg.lab/loki-retention]"
  - source: {kind: ClusterParams, name: params, fieldPath: spec.loki.bucketStorageClass}
    targets:
      - select: {kind: ObjectBucketClaim, labelSelector: pg.lab/role=loki-bucket}
        fieldPaths:
          - "spec.storageClassName"
