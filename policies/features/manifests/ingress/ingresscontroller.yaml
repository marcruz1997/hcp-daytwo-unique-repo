apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: default
  namespace: openshift-ingress-operator
spec:
  replicas: '{{hub index .ManagedClusterLabels "config.pg.lab/ingress-replicas" | toInt hub}}'
  nodePlacement:
    nodeSelector:
      matchLabels:
        hcp.lab/infra-workloads: "true"
    tolerations:
      - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoSchedule}
      - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoExecute}
