# Credenciais do bucket criado no HUB pelo ObjectBucketClaim loki-<cluster> (chart, feature loki).
# Hub templates só leem objetos do namespace da policy (pg-policies-features); "protect" criptografa.
apiVersion: v1
kind: Secret
metadata:
  name: logging-loki-s3
  namespace: openshift-logging
type: Opaque
data:
  bucketnames: '{{hub fromConfigMap "pg-policies-features" (printf "loki-%s" .ManagedClusterName) "BUCKET_NAME" | base64enc hub}}'
  endpoint: '{{hub printf "%s://%s:%s" (index .ManagedClusterLabels "config.pg.lab/loki-s3-scheme") (fromConfigMap "pg-policies-features" (printf "loki-%s" .ManagedClusterName) "BUCKET_HOST") (fromConfigMap "pg-policies-features" (printf "loki-%s" .ManagedClusterName) "BUCKET_PORT") | base64enc hub}}'
  access_key_id: '{{hub fromSecret "pg-policies-features" (printf "loki-%s" .ManagedClusterName) "AWS_ACCESS_KEY_ID" | protect hub}}'
  access_key_secret: '{{hub fromSecret "pg-policies-features" (printf "loki-%s" .ManagedClusterName) "AWS_SECRET_ACCESS_KEY" | protect hub}}'
  forcepathstyle: dHJ1ZQ==   # "true" (Ceph RGW / NooBaa usam path-style)
