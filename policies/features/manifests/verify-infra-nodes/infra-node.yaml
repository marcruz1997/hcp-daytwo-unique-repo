# Sem "name": Compliant se EXISTIR pelo menos um nó com o label e o taint de infra.
# (o NodePool <nome>-infra criado pela policy hcp-<nome> no hub)
apiVersion: v1
kind: Node
metadata:
  labels:
    node-role.kubernetes.io/infra: ""
    hcp.lab/infra-workloads: "true"
spec:
  taints:
    - key: node-role.kubernetes.io/infra
      value: reserved
      effect: NoSchedule
    - key: node-role.kubernetes.io/infra
      value: reserved
      effect: NoExecute
