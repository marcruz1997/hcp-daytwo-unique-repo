apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
data:
  config.yaml: |
    enableUserWorkload: true
    prometheusK8s:
      retention: {{hub index .ManagedClusterLabels "config.pg.lab/prom-retention" hub}}
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: {{hub index .ManagedClusterLabels "config.pg.lab/prom-storage" hub}}
      nodeSelector:
        hcp.lab/infra-workloads: "true"
      tolerations:
        - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoSchedule}
        - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoExecute}
    alertmanagerMain:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: {{hub index .ManagedClusterLabels "config.pg.lab/am-storage" hub}}
      nodeSelector:
        hcp.lab/infra-workloads: "true"
      tolerations:
        - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoSchedule}
        - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoExecute}
    prometheusOperator:
      nodeSelector:
        hcp.lab/infra-workloads: "true"
      tolerations:
        - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoSchedule}
        - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoExecute}
    metricsServer:
      nodeSelector:
        hcp.lab/infra-workloads: "true"
      tolerations:
        - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoSchedule}
        - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoExecute}
    kubeStateMetrics:
      nodeSelector:
        hcp.lab/infra-workloads: "true"
      tolerations:
        - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoSchedule}
        - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoExecute}
    telemeterClient:
      nodeSelector:
        hcp.lab/infra-workloads: "true"
      tolerations:
        - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoSchedule}
        - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoExecute}
    openshiftStateMetrics:
      nodeSelector:
        hcp.lab/infra-workloads: "true"
      tolerations:
        - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoSchedule}
        - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoExecute}
    thanosQuerier:
      nodeSelector:
        hcp.lab/infra-workloads: "true"
      tolerations:
        - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoSchedule}
        - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoExecute}
    monitoringPlugin:
      nodeSelector:
        hcp.lab/infra-workloads: "true"
      tolerations:
        - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoSchedule}
        - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoExecute}
