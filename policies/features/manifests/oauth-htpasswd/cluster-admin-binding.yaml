# O IdP htpasswd é configurado no HostedCluster (chart). Aqui só damos cluster-admin ao usuário.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hcp-lab-oauth-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: '{{hub index .ManagedClusterLabels "config.pg.lab/oauth-admin" hub}}'
