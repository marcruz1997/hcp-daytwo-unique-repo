# ================= CLUSTER NOME =================
# Escolha o que o cluster tem (a ordem não importa) e sobrescreva só o que
# for diferente dos defaults (provisioning/base/params-defaults.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../../provisioning/base]
components:
  # --- tamanho dos workers (padrão: small) ---
  - ../../../provisioning/workers/small              # demo|small|medium|large|xlarge
  # --- nós de infra (opcional) ---
  # - ../../../provisioning/infra/small              # demo|small|medium|large|xlarge
  # --- features (descomente o que quiser) ---
  # - ../../../provisioning/features/oauth-htpasswd
  # - ../../../provisioning/features/ntp
  # - ../../../provisioning/features/etcd-backup
  # - ../../../provisioning/features/ingress
  # - ../../../provisioning/features/registry
  # - ../../../provisioning/features/observability
  # - ../../../provisioning/features/logging        # já inclui o loki
  # - ../../../provisioning/features/loki
  # - ../../../provisioning/features/proxy          # ou features/proxy-ca (com CA própria)
patches:
  - target: {kind: ClusterParams}
    patch: |-
      kind: ClusterParams
      metadata: {name: params}
      spec:
        name: NOME
        # --- descomente só o que for diferente do padrão ---
        # env: prd
        # releaseImage: quay.io/openshift-release-dev/ocp-release:4.18.60-multi
        # workerReplicas: 3
        # infraReplicas: 3
        # clusterNetwork: 10.132.0.0/14
        # serviceNetwork: 172.31.0.0/16
        # oauth:
        #   htpasswd: |
        #     admin:$2y$05$...
        # ingress: {replicas: "3"}
        # observability: {prometheusRetention: 15d, prometheusStorage: 50Gi}
        # loki: {size: 1x.small, retentionDays: "15"}
        # proxy:
        #   httpProxy: http://proxy.empresa.local:3128
        #   httpsProxy: http://proxy.empresa.local:3128
        #   noProxy: .empresa.local,10.0.0.0/8
transformers: [../../../provisioning/apply-params]
