# Lado HOSTING: policy que CRIA e MANTÉM este cluster no HUB (local-cluster).
# HostedCluster/NodePools/secrets em clusters, Role em clusters-<nome>, CronJob em hcp-etcd-backup,
# ManagedCluster e KlusterletAddonConfig. Conteúdo: hosting/ (base + components + params).
# Troque "NOME" pelo nome do cluster nas 3 linhas marcadas.
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: hcp-NOME                       # <- nome
placementBindingDefaults:
  name: pb-hcp-NOME                    # <- nome
policyDefaults:
  namespace: pg-provisioning
  remediationAction: enforce
  severity: high
  complianceType: musthave
  # NUNCA mude para DeleteIfCreated/DeleteAll: apagaria o HostedCluster
  # se a policy sair do Placement ou for removida.
  pruneObjectBehavior: None
  categories: ["CM Configuration Management"]
  standards: ["NIST SP 800-53"]
  controls: ["CM-2 Baseline Configuration"]
  placement:
    name: pl-hcp-NOME                  # <- nome
    labelSelector:
      matchExpressions:
        - {key: local-cluster, operator: In, values: ["true"]}
policies:
  - name: hcp-NOME
    manifests:
      - path: hosting
