# Policies de day-2 por feature (selecionadas pelos labels feature.pg.lab/*).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pg-policies-features
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/marcruz1997/hcp-modules-policies.git
    targetRevision: v1.0.0         # versão do catálogo; suba junto com a maior versão usada pelos clusters
    path: policies
  destination:
    server: https://kubernetes.default.svc
    namespace: pg-policies-features
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
