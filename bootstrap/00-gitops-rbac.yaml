# Permissões do Argo CD (openshift-gitops) para este repo.
# O Argo só cria Policies/Placements e recursos de hub; quem cria HostedCluster/NodePool/
# ManagedCluster é o ACM, através das policies em pg-provisioning.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pg-gitops
rules:
  - apiGroups: ["policy.open-cluster-management.io"]
    resources: ["policies", "policysets", "placementbindings"]
    verbs: ["*"]
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["placements", "managedclustersetbindings", "managedclustersets/bind"]
    verbs: ["*"]
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["placementdecisions", "managedclustersets", "managedclusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces", "serviceaccounts"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pg-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pg-gitops
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
